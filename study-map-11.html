<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3b4cca">
<title>نقشه مطالعه</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f5f9; --surface:#ffffff; --surface-2:#f5f7fb; --ink:#0e1628; --ink-2:#3a475d; --muted:#667389;
    --line:#e3e8f0; --line-2:#cfd7e3; --accent:#3b4cca;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --pad:clamp(16px,3.2vw,40px);
    --side:264px;
    --sh-1:0 1px 2px rgba(14,22,40,.05);
    --sh-2:0 1px 2px rgba(14,22,40,.05),0 8px 20px -10px rgba(14,22,40,.14);
    --sh-3:0 2px 4px rgba(14,22,40,.06),0 16px 32px -14px rgba(14,22,40,.22);
    --safe-b:env(safe-area-inset-bottom,0px);
    --bar-h:68px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a0e16; --surface:#121927; --surface-2:#182032; --ink:#edf1f8; --ink-2:#c6d0df; --muted:#8996ad;
      --line:#222c40; --line-2:#2f3b54;
      --sh-1:0 1px 2px rgba(0,0,0,.35); --sh-2:0 1px 2px rgba(0,0,0,.4),0 8px 20px -10px rgba(0,0,0,.6); --sh-3:0 2px 4px rgba(0,0,0,.45),0 16px 32px -14px rgba(0,0,0,.7);
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;line-height:1.75;font-size:15px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button,input,textarea{font:inherit;color:inherit}
  button{touch-action:manipulation}
  svg{display:block}
  h1,h2,p{margin:0}
  :focus-visible{outline:2.5px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px;border-radius:8px}

  .app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;min-height:100dvh}

  /* ================= sidebar ================= */
  .side{position:sticky;top:0;height:100vh;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;
    padding:22px 14px;background:var(--surface);border-inline-end:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:11px;padding:0 10px 22px;font-weight:800;font-size:1.05rem;letter-spacing:-.01em}
  .brand svg{width:32px;height:32px;color:var(--accent);flex:none}
  .side-title{margin:20px 10px 8px;font-size:.76rem;font-weight:600;color:var(--muted)}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav-item{position:relative;border:none;background:transparent;text-align:start;cursor:pointer;border-radius:var(--r-sm);padding:9px 12px;
    display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;color:var(--ink-2);transition:background .15s,color .15s}
  .nav-item:hover{background:var(--surface-2)}
  .nav-item[aria-current]{background:var(--surface-2);color:var(--ink);font-weight:600}
  .nav-item[aria-current]::before{content:"";position:absolute;inset-inline-start:0;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--c,var(--accent))}
  .nav-item .dot{width:10px;height:10px;border-radius:3px;background:var(--c,var(--muted));grid-row:span 2}
  .nav-item svg{width:17px;height:17px;grid-row:span 2;color:var(--muted)}
  .nav-item[aria-current] svg{color:var(--accent)}
  .nav-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-item .pct{font-size:.76rem;color:var(--muted);font-weight:500}
  .bar{grid-column:2 / 4;height:4px;border-radius:99px;background:var(--line);overflow:hidden}
  .bar b{display:block;height:100%;background:var(--c,var(--accent));border-radius:99px;transition:width .35s}
  .side-btn{margin-top:10px;border:1px dashed var(--line-2);background:transparent;border-radius:var(--r-sm);padding:10px;min-height:42px;cursor:pointer;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:7px;font-weight:500;transition:all .15s}
  .side-btn:hover{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,transparent)}
  .side-btn svg{width:15px;height:15px}

  /* ================= topbar ================= */
  .content{min-width:0}
  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;min-height:60px;padding:8px var(--pad);
    background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
  .crumb{color:var(--muted);font-size:.88rem;display:flex;gap:8px;align-items:center;min-width:0;flex:1}
  .crumb b{color:var(--ink);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .top-actions{display:flex;gap:8px;flex:none}
  .btn{position:relative;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);height:38px;padding:0 14px;cursor:pointer;font-size:.86rem;font-weight:500;color:var(--ink-2);
    display:flex;gap:7px;align-items:center;justify-content:center;box-shadow:var(--sh-1);transition:border-color .15s,background .15s}
  .btn:hover{border-color:var(--muted);background:var(--surface-2)}
  .btn svg{width:16px;height:16px;flex:none}
  .btn.dirty{border-color:var(--accent)}
  .btn.dirty::after{content:"";position:absolute;top:-4px;inset-inline-end:-4px;width:10px;height:10px;border-radius:50%;background:#f59e0b;border:2px solid var(--bg)}

  main{width:100%;max-width:1240px;padding:32px var(--pad) 80px}
  .page-head{margin-bottom:24px}
  .page-title{font-size:clamp(1.35rem,1.05rem + 1.1vw,1.75rem);font-weight:800;letter-spacing:-.01em;line-height:1.5}
  .page-sub{margin-top:2px;color:var(--muted);max-width:60ch}

  /* ================= overview ================= */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 18px;box-shadow:var(--sh-1)}
  .stat span{color:var(--muted);font-size:.82rem}
  .stat b{display:block;font-size:1.7rem;font-weight:800;line-height:1.35;margin-top:2px;letter-spacing:-.01em}
  .stat b small{font-size:.85rem;font-weight:500;color:var(--muted);margin-inline-start:5px}

  .settings{display:grid;grid-template-columns:repeat(2,minmax(0,320px));gap:16px 28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;box-shadow:var(--sh-1);margin-bottom:28px}
  .field{display:flex;flex-direction:column;gap:4px;min-width:0}
  .field label{font-size:.82rem;color:var(--muted);font-weight:500}
  .field input{width:100%;border:1px solid var(--line-2);background:var(--surface-2);border-radius:var(--r-sm);padding:6px 12px;min-height:40px;color-scheme:light dark}
  .field small{color:var(--ink-2);font-size:.8rem;min-height:1.4em}

  .ov-board{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;align-items:start}
  .lane{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-lg);padding:12px}
  .lane-head{display:block;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px 14px;cursor:pointer;
    box-shadow:var(--sh-1);margin-bottom:12px;position:relative;overflow:hidden;transition:box-shadow .2s}
  .lane-head:hover{box-shadow:var(--sh-2)}
  .lane-head::before{content:"";position:absolute;inset-inline:0;top:0;height:3px;background:var(--c)}
  .lane-head strong{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lane-head small{display:block;color:var(--muted);font-size:.78rem;margin-bottom:8px}
  .lane-head .bar{display:block}
  .ov-cell{display:flex;flex-direction:column;align-items:center}
  .ov-cell:not(:last-child)::after{content:"";width:2px;height:10px;background:color-mix(in srgb,var(--c) 40%,var(--line-2));border-radius:2px}
  .ov-box{width:100%;min-height:70px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:9px 14px;cursor:pointer;text-align:start;
    overflow:hidden;box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s,border-color .15s}
  .ov-box:hover{transform:translateY(-1px);box-shadow:var(--sh-2);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
  .ov-box.current{border-color:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 14%,transparent)}
  .ov-box b{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--c);font-weight:600}
  .ov-box span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.86rem;line-height:1.6;color:var(--ink-2)}
  .ov-box.done{background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
  .ov-box.done span,.ov-box.done b{color:var(--muted)}
  .empty{color:var(--muted);text-align:center;padding:56px 20px;background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r-lg)}

  /* ================= subject ================= */
  .subject{display:grid;grid-template-columns:minmax(280px,320px) minmax(0,1fr);gap:28px;align-items:start}
  .head-card{position:sticky;top:84px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-2);display:grid;gap:18px}
  .head-card::before{content:"";position:absolute;inset-inline:0;top:0;height:4px;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--c)}
  .head-top{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding-top:4px}
  .head-main{min-width:0}
  .head-card input.name{font-size:1.3rem;font-weight:800;border:none;background:transparent;color:var(--ink);padding:2px 0;width:100%;border-bottom:2px solid transparent;letter-spacing:-.01em;border-radius:0;min-height:40px}
  .head-card input.name:hover{border-bottom-color:var(--line-2)}
  .head-card input.name:focus{outline:none;border-bottom-color:var(--c)}
  .head-sub{display:block;color:var(--muted);font-size:.8rem}
  .ring{position:relative;width:76px;height:76px;flex:none}
  .ring svg{width:100%;height:100%;transform:rotate(90deg) scaleX(-1)}
  .ring circle{fill:none;stroke-width:7}
  .ring .trk{stroke:var(--surface-2)}
  .ring .val{stroke:var(--c);stroke-linecap:round;transition:stroke-dashoffset .4s}
  .ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;font-size:1rem}
  .head-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px 0;border-block:1px solid var(--line);color:var(--muted);font-size:.78rem;text-align:center}
  .head-meta span{display:flex;flex-direction:column;line-height:1.5}
  .head-meta b{color:var(--ink);font-weight:800;font-size:1.25rem}
  .head-tools{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .swatches{display:flex;gap:9px;flex-wrap:wrap}
  .sw{width:24px;height:24px;border-radius:50%;border:none;cursor:pointer;padding:0;transition:transform .12s}
  .sw:hover{transform:scale(1.14)}
  .sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
  .ghost{border:none;background:none;color:var(--muted);cursor:pointer;padding:5px 10px;border-radius:8px;font-size:.84rem}
  .ghost:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
  .ghost:disabled{opacity:.25;cursor:default}
  .danger:hover:not(:disabled){color:#dc2626!important;background:color-mix(in srgb,#dc2626 9%,transparent)!important}

  .chain{display:flex;flex-direction:column;gap:12px;max-width:760px;min-width:0}
  .week{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 14px 14px 12px;box-shadow:var(--sh-1);
    display:grid;grid-template-columns:28px minmax(0,1fr) auto;column-gap:12px;row-gap:6px;align-items:center;transition:box-shadow .2s,border-color .2s}
  .week + .week::before{content:"";position:absolute;top:-13px;height:13px;width:2px;inset-inline-start:27px;background:color-mix(in srgb,var(--c) 45%,var(--line-2));border-radius:2px}
  .week:hover,.week:focus-within{box-shadow:var(--sh-2);border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
  .week.current{border-color:color-mix(in srgb,var(--c) 60%,var(--line));box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 11%,transparent),var(--sh-2)}
  .week-body{display:contents}
  .week input[type=checkbox]{grid-area:1/1;appearance:none;-webkit-appearance:none;width:28px;height:28px;border-radius:50%;margin:0;
    border:2px solid var(--line-2);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:all .15s}
  .week input[type=checkbox]:hover{border-color:var(--c)}
  .week input[type=checkbox]:checked{background:var(--c);border-color:var(--c)}
  .week input[type=checkbox]:checked::after{content:"";width:7px;height:12px;border:solid #fff;border-width:0 2.4px 2.4px 0;transform:translateY(-1px) rotate(45deg)}
  .week-meta{grid-area:1/2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
  .tag{font-size:.76rem;font-weight:600;color:var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));padding:1px 11px;border-radius:99px;white-space:nowrap}
  .tag.now{color:#fff;background:var(--c)}
  .week-actions{grid-area:1/3;display:flex;opacity:0;transition:opacity .15s}
  .week:hover .week-actions,.week:focus-within .week-actions{opacity:1}
  .week-actions .ghost{padding:4px 6px}
  .week-actions svg{width:16px;height:16px}
  .week textarea{grid-area:2/2/3/4;width:100%;border:none;background:transparent;color:var(--ink);resize:none;overflow:hidden;min-height:30px;padding:0;line-height:1.85;display:block}
  .week textarea:focus{outline:none}
  .week textarea::placeholder{color:var(--muted);opacity:.75}
  .week.done textarea{color:var(--muted);text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--muted) 50%,transparent)}
  .week.done .tag{color:var(--muted);background:var(--surface-2)}
  .add-week{margin-top:4px;border:1.5px dashed color-mix(in srgb,var(--c) 45%,var(--line-2));color:var(--c);background:transparent;border-radius:var(--r-md);
    width:100%;min-height:50px;padding:10px;cursor:pointer;font-weight:600;display:flex;gap:7px;align-items:center;justify-content:center;transition:background .15s}
  .add-week:hover{background:color-mix(in srgb,var(--c) 8%,transparent)}
  .add-week svg{width:16px;height:16px}

  /* ================= toast ================= */
  .toast{position:fixed;inset-inline:0;bottom:calc(22px + var(--safe-b));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);z-index:30;
    background:#111827;color:#fff;border-radius:var(--r-md);padding:9px 12px 9px 16px;display:flex;gap:14px;align-items:center;box-shadow:var(--sh-3);
    transform:translateY(30px);opacity:0;pointer-events:none;transition:all .25s}
  .toast.show{transform:none;opacity:1;pointer-events:auto}
  .toast button{border:none;background:rgba(255,255,255,.14);color:#fff;border-radius:8px;min-height:34px;padding:3px 14px;cursor:pointer;font-weight:600}
  .toast button:hover{background:rgba(255,255,255,.24)}

  /* ================= laptop / tablet ================= */
  @media (max-width:1180px){
    :root{--side:228px}
    .subject{grid-template-columns:minmax(260px,290px) minmax(0,1fr);gap:22px}
  }

  /* ================= tablet portrait + mobile ================= */
  @media (max-width:900px){
    .app{display:block}

    /* sidebar becomes a bottom tab bar */
    .side{position:fixed;inset-inline:0;bottom:0;top:auto;height:auto;z-index:20;flex-direction:row;align-items:center;gap:8px;
      padding:10px 12px calc(10px + var(--safe-b));overflow-x:auto;overflow-y:hidden;border-inline-end:none;border-top:1px solid var(--line);
      background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-x:contain}
    .side::-webkit-scrollbar{display:none}
    .brand,.side-title{display:none}
    .side .nav{flex-direction:row;gap:8px;flex:none}
    .nav-item{flex:none;min-height:44px;padding:6px 14px;border:1px solid var(--line);border-radius:99px;background:var(--surface);
      grid-template-columns:auto auto auto;gap:8px;white-space:nowrap}
    .nav-item[aria-current]{background:color-mix(in srgb,var(--c,var(--accent)) 13%,var(--surface));border-color:var(--c,var(--accent))}
    .nav-item::before,.nav-item .bar{display:none}
    .nav-item .dot,.nav-item svg{grid-row:auto}
    .nav-item .nm{max-width:130px}
    .side-btn{flex:none;margin:0;min-height:44px;padding:6px 16px;border-radius:99px;white-space:nowrap}

    .topbar{min-height:56px;padding:8px 14px}
    .crumb{font-size:.92rem}
    .btn{width:42px;height:42px;padding:0;border-radius:var(--r-md)}
    .btn .lbl{display:none}
    .btn svg{width:18px;height:18px}
    #printBtn{display:none}

    main{padding:20px 14px calc(var(--bar-h) + 32px + var(--safe-b))}
    .page-head{margin-bottom:18px}

    .stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .stat{padding:12px 14px}
    .stat b{font-size:1.45rem}
    .stat:last-child:nth-child(odd){grid-column:1 / -1}
    .settings{grid-template-columns:minmax(0,1fr);gap:14px;padding:14px;margin-bottom:22px}
    .field input{font-size:16px;min-height:46px}

    /* overview: horizontal swipe lanes */
    .ov-board{display:flex;overflow-x:auto;gap:12px;margin-inline:-14px;padding:2px 14px 16px;scroll-snap-type:x mandatory;scroll-padding-inline:14px;-webkit-overflow-scrolling:touch}
    .lane{flex:0 0 82%;max-width:340px;scroll-snap-align:start}

    /* subject: stacked */
    .subject{grid-template-columns:minmax(0,1fr);gap:18px}
    .head-card{position:relative;top:0;padding:16px;gap:14px;border-radius:var(--r-lg)}
    .head-top{gap:14px}
    .ring{width:64px;height:64px}
    .ring span{font-size:.92rem}
    .head-card input.name{font-size:1.2rem}
    .sw{width:28px;height:28px}
    .swatches{gap:10px}
    .head-tools .danger{min-height:40px}

    .chain{max-width:none}
    .week{padding:12px;border-radius:var(--r-md)}
    .week + .week::before{inset-inline-start:26px}
    .week-actions{opacity:1}
    .week-actions .ghost{width:38px;height:38px;padding:0;display:grid;place-items:center;border-radius:10px}
    .week-actions svg{width:18px;height:18px}
    .week textarea{grid-area:2/1/3/4;font-size:16px;margin-top:4px;min-height:36px}
    .add-week{min-height:54px}

    .toast{bottom:calc(var(--bar-h) + 14px + var(--safe-b))}
  }
  @media (max-width:380px){
    .stat b{font-size:1.3rem}
    .lane{flex-basis:88%}
    .nav-item .nm{max-width:96px}
    .head-meta b{font-size:1.1rem}
  }
  @media (hover:none){
    .week-actions{opacity:1}
    .ov-box:hover{transform:none}
  }
  @media print{
    .side,.topbar,.toast,.settings,.add-week,.week-actions,.head-tools{display:none!important}
    .app{display:block}
    body{background:#fff;color:#000}
    main{padding:0;max-width:none}
    .ov-board{display:grid;grid-template-columns:repeat(3,1fr);overflow:visible;margin:0;padding:0}
    .head-card{position:static}
    *{box-shadow:none!important}
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none!important;scroll-behavior:auto!important} }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="9" fill="currentColor"/>
        <rect x="9" y="7" width="14" height="5" rx="2.5" fill="#fff"/><path d="M16 14v3.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <rect x="9" y="20" width="14" height="5" rx="2.5" fill="#fff" fill-opacity=".75"/></svg>
      نقشه مطالعه
    </div>
    <div class="nav" id="navTop"></div>
    <div class="side-title">درس‌ها</div>
    <nav class="nav" id="nav" aria-label="درس‌ها"></nav>
    <button class="side-btn" id="addSubject">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>درس جدید</button>
  </aside>
  <div class="content">
    <div class="topbar">
      <div class="crumb" id="crumb"></div>
      <div class="top-actions">
        <button class="btn" id="printBtn" title="چاپ" aria-label="چاپ">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M4.5 6V2.5h7V6M4.5 11.5h-2v-5h11v5h-2M4.5 9.5h7v4h-7z"/></svg><span class="lbl">چاپ</span></button>
        <button class="btn" id="importBtn" title="بارگذاری از فایل" aria-label="بارگذاری از فایل">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 11V2M4.5 5.5 8 2l3.5 3.5M2.5 10v3h11v-3"/></svg><span class="lbl">بارگذاری</span></button>
        <button class="btn" id="exportBtn" title="ذخیره در فایل" aria-label="ذخیره در فایل">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v9M4.5 7.5 8 11l3.5-3.5M2.5 10v3h11v-3"/></svg><span class="lbl">ذخیره فایل</span></button>
      </div>
    </div>
    <main id="view"></main>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button id="toastUndo">بازگردانی</button></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
const COLORS = ['#4f46e5','#0f766e','#7c3aed','#b45309','#0369a1','#15803d'];
const COLOR_NAMES = ['نیلی','سبزآبی','بنفش','کهربایی','آبی','سبز'];
const fa = n => Number(n).toLocaleString('fa-IR');
const uid = () => 's' + Math.random().toString(36).slice(2, 8);

const state = {
  active: 'overview',
  examDate: '',
  subjects: [
    { id: uid(), name: 'ریاضی', color: COLORS[0], weeks: [
      { text: 'مجموعه، الگو و دنباله', done: false },
      { text: 'تابع و معادله', done: false },
    ]},
    { id: uid(), name: 'فیزیک', color: COLORS[1], weeks: [
      { text: 'کار و انرژی', done: false },
    ]},
  ]
};

const $ = s => document.querySelector(s);
const subj = id => state.subjects.find(s => s.id === id);
const doneCount = s => s.weeks.filter(w => w.done).length;
const progress = s => s.weeks.length ? Math.round(100 * doneCount(s) / s.weeks.length) : 0;
const currentIdx = s => s.weeks.findIndex(w => !w.done);
const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isMobile = () => window.matchMedia('(max-width:900px)').matches;

/* ---------- dates (Jalali display) ---------- */
const jShort = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long' });
const jFull = new Intl.DateTimeFormat('fa-IR-u-ca-persian', { day: 'numeric', month: 'long', year: 'numeric' });
const parseD = v => { const [y,m,d] = v.split('-').map(Number); return new Date(y, m-1, d, 12); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const daysToExam = () => {
  if (!state.examDate) return null;
  const now = new Date(); now.setHours(12,0,0,0);
  return Math.round((parseD(state.examDate) - now) / 864e5);
};

/* ---------- unsaved changes ---------- */
let dirty = false;
function touch(){ dirty = true; $('#exportBtn').classList.add('dirty'); }
function clean(){ dirty = false; $('#exportBtn').classList.remove('dirty'); }
window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue = ''; } });

/* ---------- undo toast ---------- */
let undoSnap = null, toastTimer;
function snapshot(){ return JSON.stringify({ subjects: state.subjects, active: state.active }); }
function showToast(msg, snap){
  undoSnap = snap;
  $('#toastMsg').textContent = msg;
  $('#toast').classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('#toast').classList.remove('show'), 7000);
}
$('#toastUndo').addEventListener('click', () => {
  if (!undoSnap) return;
  const d = JSON.parse(undoSnap);
  state.subjects = d.subjects; state.active = d.active; undoSnap = null;
  $('#toast').classList.remove('show'); touch(); render();
});

/* ---------- icons ---------- */
const gridIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="2" y="2" width="5" height="5" rx="1.5"/><rect x="9" y="2" width="5" height="5" rx="1.5"/><rect x="2" y="9" width="5" height="5" rx="1.5"/><rect x="9" y="9" width="5" height="5" rx="1.5"/></svg>`;
const trashIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8h5.8l.6-8"/></svg>`;
const upIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10l4-4 4 4"/></svg>`;
const downIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6l4 4 4-4"/></svg>`;
const plusIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>`;

/* ---------- sidebar + breadcrumb ---------- */
function renderTabs(){
  const cur = a => state.active === a ? 'aria-current="page"' : '';
  $('#navTop').innerHTML =
    `<button class="nav-item" data-id="overview" ${cur('overview')} style="--c:var(--accent)">
      ${gridIcon}<span class="nm">نمای کلی</span><span class="pct"></span></button>`;
  $('#nav').innerHTML = state.subjects.map(s =>
    `<button class="nav-item" data-id="${s.id}" style="--c:${s.color}" ${cur(s.id)}>
      <span class="dot"></span><span class="nm">${esc(s.name || 'بدون نام')}</span><span class="pct">${fa(progress(s))}٪</span>
      <span class="bar"><b style="width:${progress(s)}%"></b></span></button>`
  ).join('');
  const s = subj(state.active);
  $('#crumb').innerHTML = `<span>نقشه مطالعه</span><span>/</span><b>${s ? esc(s.name || 'بدون نام') : 'نمای کلی'}</b>`;
}

/* ---------- subject view ---------- */
const CIRC = 2 * Math.PI * 30;
function renderSubject(s){
  const cur = currentIdx(s);
  const last = s.weeks.length - 1;
  const done = doneCount(s);
  $('#view').innerHTML = `
    <div class="subject" style="--c:${s.color}">
      <aside class="head-card">
        <div class="head-top">
          <div class="ring"><svg viewBox="0 0 76 76" aria-hidden="true"><circle class="trk" cx="38" cy="38" r="30"/>
            <circle class="val" cx="38" cy="38" r="30" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - progress(s)/100)}"/></svg>
            <span>${fa(progress(s))}٪</span></div>
          <div class="head-main">
            <input class="name" value="${esc(s.name)}" aria-label="نام درس" placeholder="نام درس">
            <span class="head-sub">${fa(done)} از ${fa(s.weeks.length)} مبحث انجام شده</span>
          </div>
        </div>
        <div class="head-meta">
          <span><b>${fa(s.weeks.length)}</b>کل مبحث‌ها</span><span><b>${fa(done)}</b>انجام‌شده</span><span><b>${fa(s.weeks.length - done)}</b>باقی‌مانده</span>
        </div>
        <div class="head-tools">
          <div class="swatches" role="group" aria-label="رنگ درس">
            ${COLORS.map((c, k) => `<button class="sw" style="background:${c}" data-color="${c}" aria-pressed="${c===s.color}" aria-label="رنگ ${COLOR_NAMES[k]}"></button>`).join('')}
          </div>
          <button class="ghost danger" id="delSubject">حذف درس</button>
        </div>
      </aside>
      <section class="chain" aria-label="مبحث‌های ${esc(s.name)}">
        ${s.weeks.map((w,i) => `
        <div class="week ${w.done ? 'done' : ''} ${i===cur ? 'current' : ''}" data-i="${i}">
          <input type="checkbox" ${w.done ? 'checked' : ''} aria-label="مبحث ${fa(i+1)} انجام شد">
          <div class="week-body">
            <div class="week-meta"><span class="tag">مبحث ${fa(i+1)}</span>${i===cur ? '<span class="tag now">در جریان</span>' : ''}</div>
            <textarea rows="1" aria-label="موضوع مبحث ${fa(i+1)}" placeholder="چه چیزی می‌خوانی؟">${esc(w.text)}</textarea>
          </div>
          <div class="week-actions">
            <button class="ghost moveUp" aria-label="انتقال به بالا" ${i===0 ? 'disabled' : ''}>${upIcon}</button>
            <button class="ghost moveDown" aria-label="انتقال به پایین" ${i===last ? 'disabled' : ''}>${downIcon}</button>
            <button class="ghost danger delWeek" aria-label="حذف مبحث ${fa(i+1)}">${trashIcon}</button>
          </div>
        </div>`).join('')}
        <button class="add-week" id="addWeek">${plusIcon}مبحث جدید</button>
      </section>
    </div>`;
  document.querySelectorAll('.week textarea').forEach(grow);
}

function grow(t){ t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }

/* ---------- overview ---------- */
function renderOverview(){
  const subs = state.subjects;
  const total = subs.reduce((a,s) => a + s.weeks.length, 0);
  const done = subs.reduce((a,s) => a + doneCount(s), 0);
  const dte = daysToExam();
  let html = `<div class="page-head"><h1 class="page-title">نمای کلی برنامه</h1></div>
    <div class="stats">
      <div class="stat"><span>درس</span><b>${fa(subs.length)}</b></div>
      <div class="stat"><span>کل مبحث‌ها</span><b>${fa(total)}</b></div>
      <div class="stat"><span>مبحث انجام‌شده</span><b>${fa(done)}</b></div>
      <div class="stat"><span>پیشرفت کل</span><b>${fa(total ? Math.round(100*done/total) : 0)}٪</b></div>
      ${dte === null ? '' : `<div class="stat"><span>مانده تا آزمون</span><b>${dte >= 0 ? fa(dte) + '<small>روز</small>' : '<small>برگزار شده</small>'}</b></div>`}
    </div>
    <div class="settings">
      <div class="field"><label for="examDate">تاریخ آزمون</label><input type="date" id="examDate" value="${state.examDate}"><small>${state.examDate ? jFull.format(parseD(state.examDate)) : 'اختیاری'}</small></div>
    </div>`;
  if (!subs.length){ $('#view').innerHTML = html + `<div class="empty">هنوز درسی اضافه نکرده‌ای. با «درس جدید» شروع کن.</div>`; return; }
  html += `<div class="ov-board">`;
  subs.forEach(s => {
    const cur = currentIdx(s);
    html += `<section class="lane" style="--c:${s.color}">
      <button class="lane-head" data-go="${s.id}"><strong>${esc(s.name || 'بدون نام')}</strong>
        <small>${fa(doneCount(s))} از ${fa(s.weeks.length)} مبحث</small><span class="bar"><b style="width:${progress(s)}%"></b></span></button>
      ${s.weeks.map((w,i) => `<div class="ov-cell">
        <button class="ov-box ${w.done ? 'done' : ''} ${i===cur ? 'current' : ''}" data-go="${s.id}" data-w="${i}"><b>مبحث ${fa(i+1)}${w.done ? ' ✓' : ''}</b><span>${esc(w.text) || '—'}</span></button>
      </div>`).join('')}
    </section>`;
  });
  html += `</div>`;
  $('#view').innerHTML = html;
}

/* ---------- main render ---------- */
function render(){
  if (state.active !== 'overview' && !subj(state.active)) state.active = 'overview';
  renderTabs();
  const s = subj(state.active);
  if (s) renderSubject(s); else renderOverview();
}

/* ---------- navigation ---------- */
function revealTab(){
  const el = document.querySelector('.nav-item[aria-current]');
  if (el && isMobile()) el.scrollIntoView({ inline: 'center', block: 'nearest' });
}
function goTo(id, weekIdx){
  state.active = id; render(); window.scrollTo(0, 0); revealTab();
  if (weekIdx !== undefined){
    const el = document.querySelectorAll('.week')[weekIdx];
    if (el) requestAnimationFrame(() => el.scrollIntoView({ block: 'center' }));
  }
}

document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('.nav-item[data-id]');
  if (tab){ goTo(tab.dataset.id); return; }
  if (t.closest('#addSubject')){
    const s = { id: uid(), name: 'درس جدید', color: COLORS[state.subjects.length % COLORS.length], weeks: [{ text: '', done: false }] };
    state.subjects.push(s); state.active = s.id; touch(); render(); window.scrollTo(0, 0); revealTab(); return;
  }
  const go = t.closest('[data-go]');
  if (go){ goTo(go.dataset.go, go.dataset.w !== undefined ? +go.dataset.w : undefined); return; }

  if (t.closest('#printBtn')){ window.print(); return; }
  if (t.closest('#exportBtn')){
    const data = { version: 4, examDate: state.examDate, subjects: state.subjects };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'study-map.json'; a.click();
    URL.revokeObjectURL(a.href); clean(); return;
  }
  if (t.closest('#importBtn')){ $('#importFile').click(); return; }

  const s = subj(state.active);
  if (!s) return;
  if (t.closest('#addWeek')){
    s.weeks.push({ text: '', done: false }); touch(); render();
    const tas = document.querySelectorAll('.week textarea'); tas[tas.length-1].focus(); return;
  }
  const wk = t.closest('.week');
  if (wk && t.closest('.delWeek')){
    const snap = snapshot();
    s.weeks.splice(+wk.dataset.i, 1); touch(); render();
    showToast('مبحث حذف شد', snap); return;
  }
  if (wk && (t.closest('.moveUp') || t.closest('.moveDown'))){
    const up = !!t.closest('.moveUp');
    const i = +wk.dataset.i, j = up ? i - 1 : i + 1;
    if (j < 0 || j >= s.weeks.length) return;
    [s.weeks[i], s.weeks[j]] = [s.weeks[j], s.weeks[i]];
    touch(); const y = window.scrollY; render(); window.scrollTo(0, y);
    const btn = document.querySelectorAll('.week')[j].querySelector(up ? '.moveUp' : '.moveDown');
    if (btn && !btn.disabled) btn.focus({ preventScroll: true });
    return;
  }
  if (t.closest('#delSubject')){
    const snap = snapshot();
    state.subjects = state.subjects.filter(x => x !== s); state.active = 'overview'; touch(); render();
    showToast(`درس «${s.name || 'بدون نام'}» حذف شد`, snap); return;
  }
  const sw = t.closest('.sw');
  if (sw){ s.color = sw.dataset.color; touch(); render(); return; }
});

document.addEventListener('input', e => {
  const s = subj(state.active);
  if (!s) return;
  if (e.target.matches('.week textarea')){
    s.weeks[+e.target.closest('.week').dataset.i].text = e.target.value; grow(e.target); touch();
  } else if (e.target.matches('input.name')){
    s.name = e.target.value; touch(); renderTabs();
  }
});

document.addEventListener('change', e => {
  if (e.target.matches('.week input[type=checkbox]')){
    const s = subj(state.active);
    const i = +e.target.closest('.week').dataset.i;
    s.weeks[i].done = e.target.checked;
    touch();
    const y = window.scrollY;
    render();
    window.scrollTo(0, y);
    const box = document.querySelectorAll('.week input[type=checkbox]')[i];
    if (box) box.focus({ preventScroll: true });
  } else if (e.target.id === 'examDate'){
    state[e.target.id] = e.target.value; touch(); render();
  }
});

window.addEventListener('resize', () => document.querySelectorAll('.week textarea').forEach(grow));

/* ---------- load from file ---------- */
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const raw = JSON.parse(await f.text());
    const list = Array.isArray(raw) ? raw : raw.subjects;
    if (!Array.isArray(list)) throw 0;
    state.subjects = list.map(s => ({
      id: s.id || uid(), name: s.name || '', color: s.color || COLORS[0],
      weeks: (s.weeks || []).map(w => ({ text: w.text || '', done: !!w.done }))
    }));
    state.examDate = (!Array.isArray(raw) && raw.examDate) || '';
    state.active = 'overview'; clean(); render();
  } catch { alert('فایل معتبر نیست.'); }
  e.target.value = '';
});

render();
</script>
</body>
</html>
